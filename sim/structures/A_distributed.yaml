name: A. 기존 분산 구조
short: A 분산 구조
kind: distributed
tagline: 교사가 창구를 직접 찾아다니는 구조
points:
  - 상담·법률·행정이 부서별로 분리
  - 사안 전체를 맡는 담당자 없음
  - 같은 이야기를 기관마다 반복
definition: 교권보호단이 생기기 전 경기도의 방식. 상담은 지역교권보호지원센터, 법률은 법률지원 부서, 행정은 교육지원청이 따로 맡고, 사안 전체를 책임지는 담당자가 없다. 피해 교원이 어디로 가야 할지 스스로 찾아 같은 이야기를 기관마다 다시 한다.
description: 상담·법률·행정 업무가 부서별로 나뉘어 있고 연결·조정하는 담당자가 없다. 피해 교사가 각 창구를 직접 찾아간다.
theory: 분화는 있으나 통합이 부족 (Lawrence & Lorsch), 분업은 있는데 조정자가 없음 (Gulick)
params:
  center_staff: 6          # 지역교권보호지원센터 상담 인력 (가정)
  legal_staff: 2           # 법률지원 인력 (가정)
  admin_staff: 4           # 교육지원청 행정 담당 (가정)
  misroute_prob: 0.3       # 창구를 잘못 찾아갈 확률 (가정)
  relay_prob: 0.5          # 기관 간 정보가 교사를 거쳐 전달돼야 할 확률 (가정)
  committee_interval_days: 60   # 2018~2020년엔 연 1회 내외 개최 [한국교육신문]
