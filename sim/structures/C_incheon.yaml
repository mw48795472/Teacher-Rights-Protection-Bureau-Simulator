name: C. 인천형 상주 통합
short: C 인천형
kind: integrated
region: 인천   # 인천 학교 550곳·5개 교육지원청, 인천 사안 규모로 돌린다 (geo/incheon.py)
tagline: 상주 인력 중심의 통합 모델 (비교군)
points:
  - 인천 교육활동보호담당관 (2024.1., 교육감 직속)
  - 상주 20명 + 위촉 지원단 43명
  - 인천 학교 550곳·교육지원청 5곳
definition: 인천광역시교육청이 2024년 1월 교육감 직속으로 설치한 교육활동보호담당관 모델. 교원치유지원센터·교육활동보호대응팀·법률지원팀을 한 조직으로 합쳤다. 담당관실에 20명(대응팀 6, 교육활동보호센터 8, 법률지원팀 5, 담당관 1)이 상주하고, 교육지원청 5곳에 담당 장학사가 1명씩 있으며, 위촉 지원단(법률 33·의료 5·교육전문가 5)이 비상근으로 붙는다. 경기와 같은 통합 구조이지만 사안 규모가 경기의 약 4분의 1이고 상주 변호사가 있다는 점이 다르다.
description: 2024년 교육감 직속 교육활동보호담당관. 상주 20명(장학사 8·전문상담사 4·변호사 2 등), 교육지원청 담당 장학사 5명, 위촉 지원단 43명. 인천 학교 550곳·교육지원청 5곳.
theory: 안정적 전담 인력(상근) 조건 비교 [인천광역시교육청 구성현황, 연합뉴스 2026-07-09, 내외일보 2025-12-04]
