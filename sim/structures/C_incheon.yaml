  caseload_per_regular: 6        # 가정 (경기와 같음)
  center_staff: 8                # 실측: 교육활동보호센터 장학사 4 + 전문상담사 4
  resident_specialists:          # 실측: 법률지원팀 변호사 2 (상주, 일정 조율 없이 바로 합류)
    법률: 2
