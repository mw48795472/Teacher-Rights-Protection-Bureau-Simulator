name: C. 인천형 상주 통합
short: C 인천형
kind: integrated
tagline: 상주 인력 중심의 통합 모델 (비교군)
points:
  - 인천 교육활동보호담당관 (2024)
  - 장학관·변호사·상담사 20여 명 상주
  - 비상근 의존이 낮아 공백이 적음
definition: 인천광역시교육청이 2024년 1월 교육감 직속으로 설치한 교육활동보호담당관 모델. 교원치유지원센터·교육활동보호대응팀·법률지원팀을 한 조직으로 합쳤고, 장학관·변호사·상담사 등 20여 명이 상주한다. 경기와 같은 통합 구조이지만 비상근보다 상주 인력에 기대는 점이 다르다. 비교 대상으로 쓴다.
description: 2024년 교육감 직속 교육활동보호담당관. 장학관·변호사·상담사 등 20여 명 상주, 위촉 변호사 33명.
theory: 안정적 전담 인력(상근) 조건 비교 [경인일보, 다음뉴스]
params:
  regular_officers: 20
  caseload_per_regular: 6
  nonregular_officers: 40
  nonregular_availability: 0.6   # 상주 인력 비중이 커서 응답성이 높다고 가정
  center_staff: 6
  linkage_procedure: true
  manual: true
  escalation: true
  committee_interval_days: 30
