# 가정값을 실증으로 바꾸려면 필요한 데이터 (근거 자료 페이지 '필요한 실증·학습 데이터' 표가 이 파일을 따릅니다).
# status: 실측(이미 반영) · 일부(대리 지표나 보도 값) · 가정(근거 없음)
# priority: 상(결론을 좌우) · 중 · 하
# how: 받는 방법 (정보공개청구는 정보공개포털 open.go.kr, 경기도교육청 대상)

empirical:
  - item: 위원회 개최 간격·심의 대기일
    current: A 60근무일, B·C 30근무일, 1회 심의 정원 6건 (sim/structures/*.yaml)
    status: 일부
    priority: 상
    why: 종결 기간 격차의 대부분이 이 값에서 나옴 (H1·H2·H3 결론을 좌우)
    need: 교육지원청별 지역교권보호위원회 개최 일자, 회당 심의 건수, 신고~심의 소요일 (2024.3 이관 이후)
    how: 경기도교육청 정보공개청구, 교육부 교권보호위원회 운영 현황
  - item: 교권보호단 사안 유형별 접수 건수
    current: 2023 교보위 침해 유형(전국)을 시뮬레이터 유형으로 대응한 비율
    status: 일부
    priority: 상
    why: 교보위 유형은 학생 침해 중심이라 학부모 민원 중심인 교권보호단 사안과 구성이 다름
    need: 교권보호 119 접수 건수를 유형·심각도·요청 지원(상담·법률·행정·수사연계·갈등조정)별로
    how: 경기도교육청 정보공개청구 (config/measured.yaml case_mix_mapping 교체)
  - item: 사안별 필요한 지원 조합
    current: 유형별 고정 조합 + 15% 복합 (sim/cases.py CASE_TYPES)
    status: 가정
    priority: 상
    why: Thompson 상호의존·Perrow 과업다양성 분류가 이 값으로 정해짐 (H2)
    need: 사안별로 실제 제공된 지원 종류 목록 (익명 사안 대장, 지원계획서 집계)
    how: 정보공개청구, 교권보호단·교육활동보호센터 협조
  - item: 업무별 처리 시간
    current: 상담 4h, 법률 10h, 행정 3h, 수사연계 2h, 갈등조정 6h (중앙값, 로그정규 편차)
    status: 가정
    priority: 상
    why: 처리 기간 지표의 크기를 정함
    need: 지원 종류별 착수~완료 소요 시간 분포, 상담 회기 수, 법률 자문 건당 시간
    how: 교육활동보호센터 운영 실적, 전담관 업무일지 집계 (정보공개청구)
  - item: 수사기관 대기 시간
    current: 중앙값 24근무시간(3근무일)
    status: 가정
    priority: 중
    why: 수사연계 사안의 종결 기간
    need: 교원 대상 아동학대 신고의 수사 개시~종결 소요일
    how: 경찰청 통계, 교육부 「교육활동 보호 후속 조치」 후속 자료
  - item: 전담관 인력 구성과 응답성
    current: 상근 20명(가정)·동시 6건(가정)·비상근 280명[보도]·즉시 응답 25%(가정)
    status: 일부
    priority: 상
    why: B·C 비교(H5)와 급증 대응(H3)을 좌우
    need: 상근·비상근 실제 인원, 1인당 동시 담당 사안, 비상근 배정 수락까지 걸린 시간
    how: 경기도교육청 정보공개청구, 인천 교권보호 조직 자료(비교군 C)
  - item: 창구 착오·재진술·중복 접수 빈도
    current: 분산 구조 착오 30%, 기관 간 전달 50%, 통합 구조 착오 5%(매뉴얼)/20%, 연계절차 없을 때 중복 50%
    status: 가정
    priority: 중
    why: 교사 부담 지표(H1)와 조례 효과(H4)
    need: 피해 교원 설문(접촉 기관 수, 같은 진술 반복 횟수), 기관 간 이관·중복 접수 건수
    how: 교원단체·교육청 실태조사, 팀 자체 설문
  - item: 분석가능성(해결 절차 명확성)
    current: 지원 2개 이하 70%·3개 이상 35%가 명확, 불명확하면 처리 1.5배·분산 구조 재방문 40%
    status: 가정
    priority: 중
    why: Perrow 효과 크기(H2)가 이 값에서 나옴
    need: 사안별 재상담·재배정 횟수, 처리 중 방침 변경 여부, 담당자가 평가한 난이도
    how: 사안 대장·지원계획서 수정 이력 (정보공개청구)
  - item: 심각도 분포
    current: 경미 45%·보통 40%·중대 15%
    status: 가정
    priority: 중
    why: 위원회 회부와 교육감 직속 지정(escalation) 여부를 정함
    need: 침해 유형별 조치 수준, 교육감 고발·중대 사안 지정 건수
    how: 교보위 조치 결과 통계(measured.yaml committee_outcomes 확장)
  - item: 결과 비교용 실측 지표 (검증 데이터)
    current: 없음 (시뮬레이터 결과를 맞춰 볼 실제 값 없음)
    status: 가정
    priority: 상
    why: 시뮬레이터가 현실을 재현하는지 확인 (예측 타당성)
    need: 교권보호단 출범 전후 평균 처리 기간, 첫 응답 시간, 교원 만족도, 재신고율
    how: 경기도교육청 성과평가 자료(조례상 성과평가), 정보공개청구

learning:   # 에이전트·지식베이스(RAG)·판정 모델에 들어갈 자료
  - item: 교권5법 법령 원문
    current: LAW_OC 키가 있으면 국가법령정보센터에서 수집, 없으면 팀 요약
    status: 일부
    priority: 상
    why: 컴플라이언스 에이전트 허용·차단 판정의 근거 (H6)
    need: 교원지위법·초중등교육법·유아교육법·교육기본법·아동학대처벌법 현행 조문
    how: 국가법령정보센터 Open API (LAW_OC)
  - item: 경기도 교권보호 조례·시행규칙 원문
    current: 일부 조문 팀 요약
    status: 일부
    priority: 상
    why: 전담관 권한(제15조), 연계절차(제17조), 매뉴얼(제25조) 판정
    need: 조례 전문과 시행규칙, 개정 이력
    how: 국가법령정보센터 자치법규, 경기도의회 회의록
  - item: 교권보호 매뉴얼·길라잡이·서식
    current: 서식 1~15 절차를 엔진에 반영, 일부 파일은 링크만
    status: 일부
    priority: 중
    why: 절차 순서와 근거 인용
    need: 교육활동 보호 매뉴얼, 교권보호단 업무매뉴얼(조례 제25조), 서식 원본
    how: 교육부·경기도교육청 공개 자료, 정보공개청구
  - item: 권한 판정 정답 예시 (평가셋)
    current: 없음
    status: 가정
    priority: 중
    why: 에이전트 판정이 맞는지 채점 (판정 정확도)
    need: 행동 → 허용·조건부·차단 + 근거 조문을 사람이 붙인 예시 50~100건
    how: 팀이 법령·매뉴얼을 보고 직접 작성, 교사·법률 전문가 검토
  - item: 실제 사안 서술 (익명)
    current: 기사 기반 1호 사안, 드라마 설정 기반 시나리오
    status: 일부
    priority: 중
    why: 시나리오와 에이전트 행동의 현실성
    need: 교보위 심의 사례집, 판례, 언론 보도 사안의 사실관계
    how: 교육부 사례집, 법원 판결문 검색, 언론 보도
