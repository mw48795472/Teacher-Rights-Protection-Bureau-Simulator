# 시연용 시나리오 사안. 사실 기반 사안은 기사에 나온 사실만 쓴다.
scenarios:
  - name: 1호 사안 (부천, 기사 사실 기반)
    description: 학생 간 다툼을 중재한 교사가 학부모로부터 악성 민원과 소송을 당함. 교육감이 1호 사안으로 지정하고 학부모를 형사 고발. [경인일보 8.10, 연합뉴스]
    type: 악성민원 + 소송
    severity: 3
    needs: [상담, 법률, 갈등조정, 수사연계]
    analyzable: false
  - name: 무고성 아동학대 신고 (가상)
    description: 수업 중 생활지도를 이유로 학부모가 아동학대로 신고하고 반복 민원을 넣는 가상 사안.
    type: 무고성 아동학대 신고
    severity: 2
    needs: [법률, 상담, 행정, 수사연계]
    analyzable: false
  - name: 참교육 5화 현중초 (드라마 설정 기반 가상)
    description: >-
      드라마 「참교육」 5화 현중초등학교 편의 설정을 옮긴 가상 사안. 부임한 지 얼마 안 된 초임 담임 교사가 한 학부모의
      반복적인 악성 민원과 압박에 시달리고, 학교 관리자는 소극적으로 대응한다. 드라마에서는 교권보호국 감독관이 담임으로
      위장 투입되고 학부모는 끝까지 반성하지 않다가 실형을 받는다 (나무위키 요약, 장면 순서는 팀 확인 필요).
      서이초 사건이 모티브 중 하나로 알려져 있다.
    type: 악성민원
    severity: 3
    needs: [상담, 법률, 갈등조정, 행정]
    analyzable: false
  # ── 실제 사례 (보도·판결로 확인된 사실만. 개인 이름 없음. 이후 항소·재수사로 결과가 바뀌었을 수 있음) ──
  - name: 서이초 교사 사망 (서울, 2023.7, 사실 기반)
    description: 1학년 담임교사가 교내에서 숨진 채 발견됨. 경찰은 68명을 조사한 뒤 범죄 혐의점 없음으로 종결하면서 학부모 민원 조정·학급 운영·업무 부담이 겹친 업무 스트레스를 배경으로 봄. 2024.2 순직 인정, 2023.9 교권보호 4법 통과의 계기. [이투데이 2023.11.14, 뉴시스 2024.2.27]
    type: 악성민원
    severity: 3
    needs: [상담, 행정, 수사연계]
    analyzable: false
    sources: [https://www.etoday.co.kr/news/view/2302165, https://www.newsis.com/view/NISX20240227_0002641713]
  - name: 대전 용산초 교사 사망 (대전, 2023.9, 사실 기반)
    description: 이전 근무교에서 학부모에게 아동학대 신고를 당한 교사(2020 검찰 무혐의)가 이후에도 민원이 이어진 끝에 사망. 교보위 개최 요청을 거부한 교장·교감은 중징계, 2024.6 순직 인정. 경찰 불송치 뒤 유족 이의신청으로 검찰이 2024.10 학부모를 명예훼손 혐의로 기소. [서울신문 2024.6.26, 2024.10.23]
    type: 악성민원 + 무고성 아동학대 신고
    severity: 3
    needs: [상담, 법률, 행정, 수사연계, 갈등조정]
    analyzable: false
    sources: [https://m.seoul.co.kr/news/2024/06/26/20240626500059, https://www.seoul.co.kr/news/society/accident/2024/10/23/20241023500085]
  - name: 의정부 호원초 학부모 민원 (경기, 2021 사망 / 2023 재조명, 사실 기반)
    description: 수업 중 다친 학생의 학부모가 담임교사에게 수년간 민원을 내고 교사가 사비로 치료비를 지급. 경기도교육청이 학부모 3명의 교육활동 침해를 확인해 2023년 업무방해로 수사 의뢰, 2023.10 순직 인정. 경찰은 2024.5 학부모·학교 관계자 모두 혐의없음으로 결론. [서울신문 2023.10.20, 프레시안 2024.5.22]
    type: 악성민원
    severity: 3
    needs: [상담, 행정, 수사연계]
    analyzable: false
    office: 의정부
    sources: [https://m.go.seoul.co.kr/news/2023/10/20/20231020500047, https://pressian.com/pages/articles/2024052215135652068]
  - name: 초등 6학년의 담임교사 폭행 (서울 양천구, 2023.6, 사실 기반)
    description: 6학년 학생이 교실에서 담임교사를 폭행해 전치 3주. 교권보호위원회가 초·중학교 최고 수위인 전학 처분과 학생 특별교육 12시간·학부모 특별교육 5시간을 의결. 교육청이 치료·심리상담·소송비·법률자문을 지원. [세계일보 2023.7.19, YTN 2023.7.21]
    type: 폭언·폭행
    severity: 3
    needs: [상담, 법률, 행정]
    analyzable: false
    sources: [https://www.segye.com/view/20230719521202, https://www.ytn.co.kr/_ln/0103_202307210923365458]
  - name: 학부모의 수업 중 교사 폭행 (인천, 2021 / 2023.11 1심, 사실 기반)
    description: 자녀의 학교폭력 회부 연락을 받은 학부모가 수업 중 교실에 들어와 담임교사를 폭행하고 욕설. 폭행·아동학대 혐의로 기소돼 1심 징역 1년·법정구속, 쌍방 항소. [서울신문 2023.11.29]
    type: 폭언·폭행
    severity: 3
    needs: [상담, 법률, 수사연계]
    analyzable: false
    sources: [https://www.twig24.com/news/world/2023/11/29/20231129500116]
  - name: 싸움 지도 후 아동학대 신고·맞소송 (광주, 2022~2023, 사실 기반)
    description: 학생 싸움을 말린 교사가 반성문을 찢은 일로 정서학대 신고를 당해 검찰이 증거불충분 불기소(학부모 항고). 학부모와 교사가 서로 손해배상 소송을 냈고 법원이 2023.6 두 청구를 모두 기각. [YTN 2023.6.19]
    type: 무고성 아동학대 신고 + 민·형사 소송
    severity: 2
    needs: [법률, 수사연계, 갈등조정]
    analyzable: false
    sources: [https://www.ytn.co.kr/_ln/0103_202306191011017150]
  - name: 다툼 사과 지도 후 아동학대 신고 (전북 군산 중학교, 2024, 사실 기반)
    description: 학생 간 다툼을 중재해 서로 사과하게 한 교사 2명이 아동학대로 신고돼 검찰에 송치됐으나 2024.9 불기소. 교원단체가 학부모를 상대로 민사소송 제기. [전북일보 2024.9.13]
    type: 무고성 아동학대 신고
    severity: 2
    needs: [상담, 법률, 수사연계]
    analyzable: false
    sources: [https://jjan.kr/article/20240913580009]
  - name: 반복 신고·소송 학부모 교육감 대리고발 (전주 초등, 2024.4, 사실 기반)
    description: 학부모가 3년간 생활지도를 문제 삼아 인권위 진정, 아동학대 신고 2회, 학교폭력 신고 3회, 민·형사·행정소송 등 20여 건을 제기. 교보위의 고발 요청에 따라 교육감이 공무집행방해·무고·명예훼손 혐의로 학부모를 대리 고발. [전북일보 2024.4.18]
    type: 악성민원 + 무고성 아동학대 신고 + 민·형사 소송
    severity: 3
    needs: [법률, 행정, 수사연계, 갈등조정]
    analyzable: false
    sources: [https://www.jjan.kr/article/20240418580059]
  - name: 고교생의 교사 딥페이크 합성·유포 (인천, 2024.7, 사실 기반)
    description: 고교생이 교사 등의 얼굴을 나체 사진에 합성해 SNS에 유포. 경찰이 성폭력처벌법 위반으로 입건·송치했고 교육지원청 교권보호위원회가 최고 수위인 퇴학 처분. 유형은 시뮬레이터 분류상 폭언·폭행(실제로는 디지털 성범죄). [경인일보 2024.9.23]
    type: 폭언·폭행
    severity: 3
    needs: [상담, 법률, 수사연계]
    analyzable: false
    sources: [https://www.kyeongin.com/article/1709815]
  - name: 악성민원 학부모 상대 교감 손해배상 승소 (전주 초등, 2026.5, 사실 기반)
    description: 학부모가 생활기록부 정정 등 반복·허위 민원을 넣어 교감이 우울증·안면마비를 겪음. 교감이 낸 민사소송에서 법원이 학부모에게 3,000만 원 배상을 선고. [서울신문 2026.5.12]
    type: 악성민원 + 민·형사 소송
    severity: 2
    needs: [법률, 상담]
    analyzable: false
    sources: [https://m.seoul.co.kr/news/2026/05/12/20260512500194]
