# 시연용 시나리오 사안. 사실 기반 사안은 기사에 나온 사실만 쓴다.
scenarios:
  - name: 1호 사안 (부천, 기사 사실 기반)
    description: 학생 간 다툼을 중재한 교사가 학부모로부터 악성 민원과 소송을 당함. 교육감이 1호 사안으로 지정하고 학부모를 형사 고발. [경인일보 8.10, 연합뉴스]
    type: 악성민원 + 소송
    severity: 3
    needs: [상담, 법률, 갈등조정, 수사연계]
    analyzable: false
  - name: 무고성 아동학대 신고 (가상)
    description: 수업 중 생활지도를 이유로 학부모가 아동학대로 신고하고 반복 민원을 넣는 가상 사안.
    type: 무고성 아동학대 신고
    severity: 2
    needs: [법률, 상담, 행정, 수사연계]
    analyzable: false
  - name: 참교육 5화 현중초 (드라마 설정 기반 가상)
    description: >-
      드라마 「참교육」 5화 현중초등학교 편의 설정을 옮긴 가상 사안. 부임한 지 얼마 안 된 초임 담임 교사가 한 학부모의
      반복적인 악성 민원과 압박에 시달리고, 학교 관리자는 소극적으로 대응한다. 드라마에서는 교권보호국 감독관이 담임으로
      위장 투입되고 학부모는 끝까지 반성하지 않다가 실형을 받는다 (나무위키 요약, 장면 순서는 팀 확인 필요).
      서이초 사건이 모티브 중 하나로 알려져 있다.
    type: 악성민원
    severity: 3
    needs: [상담, 법률, 갈등조정, 행정]
    analyzable: false
  # 드라마 「참교육」 시나리오는 팀이 줄거리를 직접 확인해 아래 형식으로 추가해 주세요.
