# KOSIS 통계표 설정. 키(KOSIS_KEY)는 .env 또는 Streamlit Secrets 에 넣는다.
teachers:
  # 학교급별 표를 각각 읽어 시도·연도별로 더한다 (초+중+고).
  # 학교급마다 tables(적어 둔 표)를 먼저, 그다음 search(이 말로 시작하는 이름의 표)를 차례로 시도한다.
  # 학교급에 file: 이 있으면 KOSIS 실패 시 그 파일(KESS 내려받기)로 채운다.
  # 읽지 못한 학교급은 빼고 더하며, ②탭 연결 상태에 '빠진 학교급'으로 사유를 보여 준다.
  levels:
    - name: 초등학교
      tables:
        - {orgId: "101", tblId: DT_1YL21251}      # e-지방지표 초등학교 교원수(시도/시/군/구)
        - {orgId: "334", tblId: DT_1963003_002}   # 교육통계 초등학교 개황
      search: [초등학교 교원수, 초등학교 개황]
    - name: 중학교
      tables:
        - {orgId: "334", tblId: DT_1963003_003}   # 교육통계 중학교 개황
        - {orgId: "334", tblId: DT_1963003_003_S}
      search: [중학교 교원수, 중학교 개황]
    - name: 고등학교
      search: [고등학교 교원수, 고등학교 개황, 일반고등학교 개황]
      # KOSIS 에서 못 받으면 이 파일로 채운다 (KESS 교육통계서비스 「고등학교 시도별 교원수 1965-2026」, '소계' 행)
      file: data/measured/raw/KESS_고등학교_시도별_교원수_1965-2026.xlsx
      file_label: KESS 교육통계서비스 파일
  # levels 를 지우면 아래 방식으로 표 하나를 찾는다
  orgId: "334"
  tblId: ""
  url: ""            # KOSIS 표 주소를 붙여 넣어도 됨 (…statHtml.do?orgId=…&tblId=…)
  search: [시도별 교원수, 시도별 교원 현황, 교원수, 학교급별 교원수]
  item: 교원           # 항목 이름 필터 (여러 항목이 올 때)
  start: 2019
  end: 2025
