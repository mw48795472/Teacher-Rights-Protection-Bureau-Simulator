# KOSIS 통계표 설정. 키(KOSIS_KEY)가 생기면 `python -m collector.kosis --search 시도별 교원` 으로 확인해 tblId를 채운다.
teachers:
  orgId: "334"        # 한국교육개발원 (교육통계)
  tblId: ""           # 비어 있으면 아래 검색어로 KOSIS에서 찾아 씀. 확인되면 기입
  url: ""            # KOSIS 표 주소를 붙여 넣어도 됨 (…statHtml.do?orgId=…&tblId=…)
  search: [시도별 교원수, 시도별 교원 현황, 교원수, 학교급별 교원수]
  item: 교원           # 항목 이름 필터 (여러 항목이 올 때)
  start: 2019
  end: 2025
