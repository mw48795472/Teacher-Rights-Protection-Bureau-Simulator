# 실제 수집 대상. 팀원이 링크를 추가하면 다음 수집에 반영됩니다.
#   python -m collector.pipeline --list   # 수집기 목록과 필요한 키
# 법령·조례·행정규칙·판례는 국가법령정보센터 Open API(LAW_OC 필요)로, 나머지는 키 없이 수집합니다.
#
# 공통 옵션
#   replaces: [시드 id]   이 원문이 들어오면 config/seed_corpus.yaml 의 해당 팀 요약을 뺍니다.
#                         (시드와 URL이 같으면 적지 않아도 자동으로 대체)

laws:            # target=law (법률·대통령령). 이름이 정확해야 합니다.
  - 교원의 지위 향상 및 교육활동 보호를 위한 특별법
  - 교원의 지위 향상 및 교육활동 보호를 위한 특별법 시행령
  - 초·중등교육법
  - 초·중등교육법 시행령
  - 유아교육법
  - 교육기본법
  - 교육공무원법
  - 아동학대범죄의 처벌 등에 관한 특례법
  - 아동복지법

ordinances:      # target=ordin (자치법규). 이 목록의 조례 조문은 같은 조문번호의 시드 요약을 대체합니다.
  - name: 경기도교육청 교권보호전담관 운영 조례
    mst: "2176205"   # ordinSeq. 검색으로 찾지 못할 때 사용

ordinance_search:  # 이름을 정확히 몰라도 검색어로 관련 자치법규를 모두 받습니다(시드 대체는 안 함).
  - query: 교육활동 보호
    must_contain: [경기도]
    max: 10
  - query: 교권
    must_contain: [경기도]
    max: 10
  - query: 교육활동 보호
    must_contain: [인천광역시]   # 비교 사례(인천 교육활동보호담당관)
    max: 5

admin_rules:     # target=admrul (행정규칙: 고시·훈령·예규). 이름이 정확해야 합니다.
  - 교육활동 침해 행위 및 조치 기준에 관한 고시
  - 교원의 학생생활지도에 관한 고시

precedents:      # target=prec. 본문 검색어별로 최신 판례를 받습니다(판시사항·판결요지·전문 앞부분).
  max_per_query: 5
  queries:
    - 교육활동 침해
    - 교권보호위원회
    - 교사 정서적 아동학대 생활지도
    - 학부모 악성 민원 교사

