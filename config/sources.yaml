boards:          # 기관 보도자료 게시판을 제목 키워드로 검색해 게시글을 수집합니다.
  - site: moe_press          # 교육부 보도자료 (첨부 HWPX·PDF 포함)
    keywords: [교권, 교육활동 보호, 교육활동 침해, 학교민원, 교원 보호]
    since: "2023-07-01"
    max_posts: 25
  - site: goe_press          # 경기도교육청 보도자료
    keywords: [교권, 교육활동 보호, 교권보호단, 교권보호전담관, 교육활동 침해]
    since: "2025-01-01"
    max_posts: 40

bills:           # 국회 법률안 (열린국회정보, ASSEMBLY_KEY). 법률안명에 검색어가 들어간 의안의 제안이유를 받습니다.
  ages: [22]                 # 국회 대수
  since: "2024-05-30"        # 제22대 개원
  max_bills: 40
  queries:
    - name: 교원의 지위 향상    # 교원지위법 개정안
    - name: 교육활동
    - name: 교권
    - name: 중등교육법          # 초ㆍ중등교육법 개정안 중 교원·교육활동 관련만
      must_contain: [교원, 교육활동, 생활지도]
    - name: 아동학대범죄의 처벌  # 아동학대처벌법 개정안 중 교원 관련만
      must_contain: [교원, 교사, 생활지도]
    - name: 유아교육법
      must_contain: [교원, 교육활동]

