# ── 시뮬레이터 사안 유형 대응 ──
# 교보위 유형은 대부분 학생에 의한 침해라, 학부모 민원 중심인 교권보호단 사안과 구성이 다릅니다.
# 경기도교육청 정보공개청구(교권보호단 유형별 접수 건수)를 받으면 이 표를 바꿉니다.
case_mix_mapping:
  폭언·폭행:   # 학생·보호자의 폭력·모욕·성적 침해
    - 상해·폭행
    - 협박
    - 모욕·명예훼손
    - 손괴
    - 성폭력범죄
    - 성적 굴욕감·혐오감
    - 불법정보 유통
    - 영상 무단 합성·배포
  악성민원:
    - 교육활동 반복적 부당 간섭
    - 공무 및 업무방해
  단순 상담:   # 수업 방해·생활지도 불응 등, 상담 중심으로 처리
    - 교육활동 방해
    - 기타
  무고성 아동학대 신고: superintendent_opinions   # 교육감 의견 제출 건수를 연 단위로 환산
  민·형사 소송: assumed                           # 실측 없음: 팀 가정 비율(10%) 유지
