# Home '이론 틀'과 '가설과 검증'에 쓰는 내용. 팀 발표 개요(조직이론 팀플) 3장·4장을 옮겼다.
question: >-
  드라마 「참교육」과 서이초 사건 이후 커진 사회적 요구 속에서, 경기도교육청은 왜 교권보호 업무를
  교육감 직속·전담관 중심 체계로 재조직했으며, 이 체계는 어떤 조건에서 실제 교권 침해에 효과적으로 대응할 수 있는가?
answer: >-
  환경 압력이 커지자 분산 구조의 조정 실패를 위계(교육감 직속)와 사안 단위 팀(전담관)으로 해결하려 했다.
  실효성은 ① 기존 조직과의 역할 구분, ② 안정적인 전담 인력, ③ 조례와 성과평가를 통한 제도화가 갖춰질 때 높아진다.

concepts:
  - key: env
    num: "①"
    title: "조직환경: 개방체계와 상황이론"
    asks: 왜 바뀌었고, 어떤 구조가 맞는가
    theories:
      - name: 개방체계
        who: Katz & Kahn (1978)
        claim: 조직은 환경과 상호작용하는 열린 체계다. 환경이 바뀌면 구조도 바뀐다.
        apply: 서이초 사건 3주기, 교원단체의 즉시 보호 요구, 드라마 흥행이라는 환경 압력 속에서 교권보호단이 출범했다.
      - name: 상황이론
        who: Burns & Stalker (1961)
        claim: 안정적 환경엔 기계적 조직(명확한 분업·위계), 불확실한 환경엔 유기적 조직(유연한 협력)이 맞다.
        apply: 교육감 직속 위계(기계적 요소)와 사안 단위 팀(유기적 요소)이 섞인 구조다.
        hyp: H3
      - name: 분화와 통합
        who: Lawrence & Lorsch (1967)
        claim: 효과적인 조직은 분화(전문화)와 통합(연결·조정)을 함께 갖춘다.
        apply: 기존 체계는 상담·법률·행정으로 분화는 있었지만 이를 묶는 통합 장치가 없었다.
        hyp: H1
      - name: 적합성(fit)
        who: Van de Ven 외 (2013)
        claim: 성과는 환경과 구조의 적합성에 달려 있다.
        apply: 조직을 새로 만드는 것만으로 적합성이 생기지 않는다. 역할 구분·전문인력·협력체계가 함께 필요하다.
        hyp: H5
  - key: coord
    num: "②"
    title: "분업과 조정"
    asks: 구조가 어떻게 바뀌었나
    theories:
      - name: 분업과 조정
        who: Gulick (1937)
        claim: 분업은 전문화의 이점을 주지만 나눈 만큼 조정이 필요하다. 조정은 위계와 구조적 통합으로 이뤄진다.
        apply: 새 구조는 위계(교육감이 단장)와 사안팀(상근 전담관이 주 담당)이라는 두 조정 장치를 둔다.
        hyp: H1
      - name: 상호의존성
        who: Thompson (1967)
        claim: 상호의존은 집합적·순차적·교호적으로 나뉜다. 교호적일수록 지속적 의사소통과 상호조정이 필요하다.
        apply: 법률·상담·조사 판단이 서로 영향을 주는 사안은 교호적 상호의존이다.
        hyp: H2
      - name: 조직기술
        who: Perrow (1967)
        claim: 예외가 많고 해결법이 불명확한 비일상적 과업일수록 전문가 판단과 협의가 중요하다.
        apply: 교권침해 사안은 유형·심각성이 다양하고 조사·법률·상담이 얽힌 비일상적 과업이다.
        hyp: H2
      - name: 기술과 구조의 적합
        who: Woodward (1965)
        claim: 업무 기술과 조직구조가 잘 맞아야 효과적이다.
        apply: 교원·변호사·상담가·경찰 출신을 전담관으로 모집해 업무에 필요한 전문성과 구조를 맞추려 했다.
        hyp: H5

# 가설: 이론 → 시뮬레이터에서 확인할 수 있는 예측
hypotheses:
  - id: H1
    theory: Lawrence & Lorsch · Gulick
    concept: "②"
    claim: 통합 장치(주 담당 전담관)가 생기면 교사가 직접 찾아가는 기관 수와 같은 내용 반복 진술이 줄어든다.
    compare: A 분산 구조 → B 교권보호단
    page: 시뮬레이션
  - id: H2
    theory: Thompson · Perrow
    concept: "②"
    claim: 필요한 지원이 여럿 얽힌(교호적·비일상적) 사안일수록 통합 구조의 효과가 커진다.
    compare: 사안 유형별 A와 B의 종결 기간 차이
    page: 시뮬레이션 (이론별 분석)
  - id: H3
    theory: Burns & Stalker
    concept: "①"
    claim: 사안이 몰리는 환경 변화(급증)에 사안 단위로 인력을 묶는 유기적 구조가 더 잘 버틴다.
    compare: 20일차부터 7일간 사안 2배, 급증 구간 종결 기간 ÷ 평소 종결 기간
    page: 시뮬레이션 (환경 압력)
  - id: H4
    theory: 공식화·제도화 (조례)
    concept: "①"
    claim: 조례의 연계절차(제17조)와 업무매뉴얼(제25조)이 있으면 같은 인력으로도 업무 중복과 창구 착오가 줄어든다.
    compare: B0 출범 초기 → B 조례 시행 후
    page: 시뮬레이션
  - id: H5
    theory: Van de Ven 적합성 · Woodward
    concept: "①"
    claim: 전담 인력이 상주할수록(인천형) 비상근 일정 공백에 따른 인수인계가 줄어든다.
    compare: B 교권보호단(비상근 중심) → C 인천형(상주 중심)
    page: 시뮬레이션
  - id: H6
    theory: 법적 권한과 공식 구조
    concept: "②"
    claim: 드라마식 강제 개입(현장 제압, 직접 조사)은 현실 법체계에서 권한 초과로 막히고, 조정 중심 구조만 제도 안에서 작동한다.
    compare: 드라마식 교권보호국 vs 교권보호단, 행동마다 법령·조례 판정
    page: 에이전트 시뮬레이션

limits:
  - 처리시간과 확률 대부분은 가정값이다. 결과는 이론의 논리를 보여주는 사고실험이며, 절대 수치보다 구조 간 차이의 방향으로 읽는다.
  - 조직 개편이 이론적으로 적절한 방향이라는 것과 실제 운영 효과가 높다는 것은 구분해야 한다. 출범 초기라 운영성과 자료로 추가 확인이 필요하다.
  - 학생·가정에 대한 상담·복지 연계가 부족하면 교사–학부모 대립이 심해질 수 있다 (허프포스트코리아). 시뮬레이터는 이 부분을 다루지 않는다.
