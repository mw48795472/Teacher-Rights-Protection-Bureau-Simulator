# 근거 자료 페이지 '주요 정책 자료 및 매뉴얼'에 보이는 목록.
# url: 공식 원문 링크 (2026-11-23 열어서 제목 확인).
# file: data/resources/ 아래 파일 이름. 파일을 넣으면 내려받기 버튼이 생깁니다 (HWP·HWPX·PDF).
# 파일도 url도 없는 항목은 '자료 필요'로 표시됩니다.

manuals:
  - title: 교육활동 침해행위의 이해
    desc: 어떤 행위가 교육활동 침해에 해당하는지 유형별로 정리한 경기교권보호지원센터 안내.
    url: https://more.goe.go.kr/eapc/subList/30300001566
    org: 경기교권보호지원센터
  - title: 교육활동 침해 피해교원 보호조치
    desc: 침해를 당한 교원이 받을 수 있는 보호조치(상담, 치유, 법률 지원 등)와 절차.
    url: https://more.goe.go.kr/eapc/subList/20000000410
    org: 경기교권보호지원센터
  - title: 교육활동 침해 가해자 분리조치
    desc: 침해 사실을 안 학교장이 가해자와 피해교원을 즉시 분리하는 절차, 예외 사유, 기간(최대 7일 권장).
    url: https://more.goe.go.kr/eapc/subList/30300002116
    org: 경기교권보호지원센터
  - title: 교원에 대한 지원 제도
    desc: 치료비 선지급(1인 200만 원 한도), SOS 경기교육법률지원단, 에듀-키퍼 법률 지원, 교원보호공제사업 안내.
    url: https://more.goe.go.kr/eapc/subList/30300002117
    org: 경기교권보호지원센터
  - title: 지역교권보호위원회 안내
    desc: 교육지원청 지역교권보호위원회의 기능과 심의 절차.
    url: https://more.goe.go.kr/eapc/subList/20000000413
    org: 경기교권보호지원센터
  - title: 교권보호 119 콜센터
    desc: 교권 침해 상담·접수 창구 안내.
    url: https://more.goe.go.kr/eapc/subList/30300001942
    org: 경기교권보호지원센터
  - title: 경기도교육청 법무행정서비스 (온라인 법률자문)
    desc: 고문 변호사 온라인 법률자문. 교권침해 관련 자문은 3일 이내 회신 (교원에 대한 지원 제도 안내 기준).
    url: https://law.goe.go.kr
    org: 경기도교육청
  - title: 교육활동 보호 매뉴얼 (교육부)
    desc: 침해 유형별 대응 단계와 부록 서식이 담긴 교육부 매뉴얼. 최신판 파일을 받으면 넣습니다.
    file: 교육활동_보호_매뉴얼.pdf
    org: 교육부

laws:
  - title: 교원의 지위 향상 및 교육활동 보호를 위한 특별법 (교원지위법)
    desc: 교육활동 침해행위의 정의, 교권보호위원회, 피해교원 보호조치, 침해학생·보호자 조치를 정한 법률.
    url: https://www.law.go.kr/법령/교원의지위향상및교육활동보호를위한특별법
  - title: 교육활동 침해 행위 및 조치 기준에 관한 고시
    desc: 침해 행위의 구체적 유형과 위원회가 내릴 수 있는 조치 기준 (교육부 고시).
    url: https://www.law.go.kr/행정규칙/교육활동침해행위및조치기준에관한고시
  - title: 교원의 학생생활지도에 관한 고시
    desc: 교원의 정당한 생활지도 범위와 방법 (교육부 고시). 생활지도와 아동학대 신고 판단의 기준이 됩니다.
    url: https://www.law.go.kr/행정규칙/교원의학생생활지도에관한고시
  - title: 아동학대범죄의 처벌 등에 관한 특례법
    desc: 아동학대 신고와 수사 절차. 교원 대상 아동학대 신고 사안에서 함께 봐야 하는 법률.
    url: https://www.law.go.kr/법령/아동학대범죄의처벌등에관한특례법
  - title: 초·중등교육법
    desc: 학생생활지도 권한 등 학교 운영의 기본 법률.
    url: https://www.law.go.kr/법령/초·중등교육법
  - title: 경기도교육청 교권보호전담관 운영 조례
    desc: 교권보호단과 전담관의 설치·업무·권한 한계, 연계절차, 업무매뉴얼을 정한 경기도 조례.
    url: https://www.law.go.kr/LSW/ordinInfoP.do?ordinSeq=2176205

forms:
  - title: 사건 경위서
    desc: 교육활동 침해 발생 경위를 적어 학교·교육청에 제출하는 양식.
    file: 사건_경위서.hwp
  - title: 교권보호위원회 심의 의견서
    desc: 지역교권보호위원회 심의에 낼 피해교원 의견서 양식.
    file: 교권보호위원회_심의_의견서.hwp
  - title: 분리 의사 확인서
    desc: 가해자 분리조치 전 피해교원의 분리 의사를 확인하는 양식 (분리조치 안내에 언급).
    file: 분리_의사_확인서.hwp
