# 지방교육재정알리미 Open API 설정. 키는 EDUFIN_KEY (Streamlit Secrets / .env).
# requestType 은 eduinfo.go.kr 'Open API 제공목록'의 서비스 이름. 확인된 것은 opclTotal(공시 총괄)뿐이라,
# 세출 결산(사업별) 서비스 이름을 확인하면 아래에 추가한다. `python -m collector.edufin --check` 로 응답 칸을 본다.
years: [2019, 2020, 2021, 2022, 2023, 2024, 2025]
services:
  - name: opcl_total
    requestType: opclTotal
# 교권보호 관련 예산으로 볼 사업명 키워드
keywords: [교권, 교육활동보호, 교육활동 보호, 교원치유, 교원 치유, 교원보호]
